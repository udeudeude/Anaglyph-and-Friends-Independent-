name: Live preview smoke test
on:
  workflow_dispatch:
  push:
    branches: [integration/preserved-studio]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/live-preview.yml'
permissions:
  contents: read
jobs:
  hosted-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for independent preview to respond
        run: |
          python - <<'PY'
          import time,urllib.request
          root='https://anaglyph-friends-independent.onrender.com'
          for attempt in range(24):
              try:
                  with urllib.request.urlopen(root+'/healthz',timeout=20) as response:
                      body=response.read(256)
                      if response.status==200 and b'ok' in body.lower():
                          print('Preview health passed');break
              except Exception as error:
                  print('Waiting for preview:',type(error).__name__,str(error)[:160])
              time.sleep(10)
          else:
              raise SystemExit('Independent preview did not become healthy')
          PY
      - name: Check deployed React shell and source availability
        run: |
          python - <<'PY'
          import urllib.request,re
          root='https://anaglyph-friends-independent.onrender.com'
          def get(path):
              with urllib.request.urlopen(root+path,timeout=30) as response:
                  data=response.read(4_000_000)
                  assert response.status==200,(path,response.status)
                  return data,response.headers
          page,_=get('/')
          assert b'<html' in page.lower() and b'Anaglyph' in page
          assets=re.findall(rb'(?:src|href)="(/assets/[^"]+)"',page)
          assert assets,'No production Vite assets referenced'
          for path in assets[:6]:
              data,_=get(path.decode())
              assert len(data)>100,path
          source,headers=get('/source')
          assert source.startswith(b'PK'),'Corresponding source is not a ZIP'
          print('Live React shell, assets, and AGPL source endpoint passed')
          PY
