name: Validate independent browser prototype
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax-and-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: test -f index.html
      - run: test -f docs/ROADMAP.md
      - run: grep -q 'Depth Anything V2' index.html
      - run: grep -q 'depth-estimation' app.js
