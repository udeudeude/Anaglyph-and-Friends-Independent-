name: Independent integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements-hosted.txt
      - run: npm ci --prefix frontend
      - run: python scripts/check.py
      - run: npm run build --prefix frontend
        env:
          VITE_FLASK_BACKEND_API_URL: '.'
      - run: python -m compileall -q backend macos scripts
  preview-check:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests numpy pillow
      - run: python scripts/live_smoke.py
      - run: python scripts/live_render_smoke.py
