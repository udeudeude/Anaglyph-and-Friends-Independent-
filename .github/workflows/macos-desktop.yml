name: Mac Desktop

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ['macos/**', 'backend/**', 'frontend/**', '.github/workflows/macos-desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: intel
          - runner: macos-14
            architecture: apple-silicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the unchanged local frontend
        working-directory: frontend
        env:
          VITE_FLASK_BACKEND_API_URL: '.'
        run: |
          npm ci
          node src/regression_contract.test.mjs
          for test in src/*.test.mjs; do node --experimental-strip-types "$test"; done
          npm run build
      - name: Install local desktop dependencies
        run: python -m pip install -r macos/requirements-desktop.txt
      - name: Regression tests
        run: |
          python macos/test_desktop.py
          bash macos/test_launcher_processes.sh
          python backend/test_technique_generator.py
          python backend/test_phantogram_generator.py
          python backend/test_depth_regenerate.py
          python backend/test_batch_workspace.py
          python backend/test_stereo_renderer.py
          python backend/test_depth_precision.py
      - name: Get pinned V2 Small code and verified weights
        run: python scripts/install_local_model.py
      - name: Verify local inference on a real photograph
        env:
          AAF_TORCH_DEVICE: cpu
        run: python scripts/verify_real_inference.py
      - name: Freeze app with Python, local V2 and frontend
        run: |
          python scripts/package_source.py
          python macos/collect_licenses.py
          python -m PyInstaller --noconfirm macos/desktop.spec
          codesign --verify --deep --strict 'dist/Anaglyph & Friends Independent.app'
      - name: Run the actual frozen application before packaging
        run: |
          "dist/Anaglyph & Friends Independent.app/Contents/MacOS/Anaglyph & Friends Independent" --smoke-test
          "dist/Anaglyph & Friends Independent.app/Contents/MacOS/Anaglyph & Friends Independent" --ui-smoke-test
      - name: Show desktop logs on failure
        if: failure()
        run: cat "$HOME/Library/Logs/Anaglyph-and-Friends-Independent/desktop.log" || true
      - name: Package checked app
        run: |
          cp macos/DOWNLOAD-README.txt dist/READ-ME-FIRST.txt
          mkdir -p 'build/download/Anaglyph & Friends Independent'
          ditto 'dist/Anaglyph & Friends Independent.app' 'build/download/Anaglyph & Friends Independent/Anaglyph & Friends Independent.app'
          cp macos/DOWNLOAD-README.txt 'build/download/Anaglyph & Friends Independent/READ-ME-FIRST.txt'
          ditto -c -k --sequesterRsrc --keepParent 'build/download/Anaglyph & Friends Independent' 'dist/Anaglyph-and-Friends-Independent-${{ matrix.architecture }}.zip'
          cd dist
          shasum -a 256 Anaglyph-and-Friends-Independent-${{ matrix.architecture }}.zip > Anaglyph-and-Friends-Independent-${{ matrix.architecture }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.architecture }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/READ-ME-FIRST.txt
          retention-days: 14

  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-*
          merge-multiple: true
          path: release-files
      - name: Publish checked versioned download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="mac-${GITHUB_SHA:0:12}"
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title 'Anaglyph & Friends Independent — standalone Mac edition' --notes-file macos/RELEASE-NOTES.md release-files/*
